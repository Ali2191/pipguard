<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 32px;
            height: 32px;
            margin-right: 12px;
        }
        h1 {
            color: #333;
            font-size: 18px;
            margin: 0;
        }
        .package-item {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .package-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }
        .risk-level {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .risk-high { background: #ffebee; color: #d63031; }
        .risk-medium { background: #fff3cd; color: #856404; }
        .risk-low { background: #cfe2ff; color: #004085; }
        .risk-safe { background: #d1f2df; color: #0f5132; }
        .reasons {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .actions {
            margin-top: 16px;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .clear-all {
            background: #6c757d;
        }
        .clear-all:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="icons/icon32.png" alt="PipGuard" class="logo">
            <h1>PipGuard Security</h1>
        </div>
        
        <div id="packages-container">
            <!-- Package items will be inserted here -->
        </div>
        
        <div class="actions">
            <button class="btn" onclick="clearAllPackages()">Clear All</button>
            <button class="btn clear-all" onclick="checkClipboard()">Check Clipboard</button>
        </div>
    </div>

    <script>
        let suspiciousPackages = [];

        // Load packages from storage
        chrome.storage.local.get(['suspiciousPackages'], (result) => {
            if (result.suspiciousPackages) {
                suspiciousPackages = result.suspiciousPackages;
                displayPackages();
            }
        });

        // Listen for storage changes
        chrome.storage.onChanged.addListener((changes) => {
            if (changes.suspiciousPackages) {
                suspiciousPackages = changes.suspiciousPackages.newValue || [];
                displayPackages();
            }
        });

        function displayPackages() {
            const container = document.getElementById('packages-container');
            container.innerHTML = '';

            if (suspiciousPackages.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">No suspicious packages detected</p>';
                return;
            }

            suspiciousPackages.forEach((pkg, index) => {
                const packageDiv = document.createElement('div');
                packageDiv.className = 'package-item';
                
                const riskClass = pkg.riskLevel.toLowerCase();
                const riskText = pkg.riskLevel.toUpperCase();
                
                packageDiv.innerHTML = `
                    <div class="package-name">${pkg.name}</div>
                    <div class="risk-level risk-${riskClass}">${riskText} RISK</div>
                    <div class="reasons">${pkg.reasons.join(', ')}</div>
                    <div class="actions">
                        <button class="btn" onclick="installPackage('${pkg.name}')">Install Anyway</button>
                        <button class="btn btn-danger" onclick="blockPackage('${pkg.name}')">Block</button>
                    </div>
                `;
                
                container.appendChild(packageDiv);
            });
        }

        function clearAllPackages() {
            suspiciousPackages = [];
            chrome.storage.local.set({ suspiciousPackages: [] });
            displayPackages();
        }

        function checkClipboard() {
            navigator.clipboard.readText().then(text => {
                if (text) {
                    // Send to background script to check
                    chrome.runtime.sendMessage({ 
                        action: 'checkClipboard',
                        text: text 
                    });
                }
            });
        }

        function installPackage(packageName) {
            // Open pip install command
            chrome.tabs.create({
                url: `terminal://pipguard install ${packageName}`
            });
        }

        function blockPackage(packageName) {
            // Add to blocked list
            chrome.storage.local.get(['blockedPackages'], (result) => {
                const blocked = result.blockedPackages || [];
                blocked.push(packageName);
                chrome.storage.local.set({ blockedPackages: blocked });
                
                // Remove from suspicious
                suspiciousPackages = suspiciousPackages.filter(pkg => pkg.name !== packageName);
                chrome.storage.local.set({ suspiciousPackages: suspiciousPackages });
                displayPackages();
            });
        }

        // Check for updates every 30 seconds
        setInterval(() => {
            chrome.runtime.sendMessage({ action: 'getMaliciousPackages' }, (response) => {
                if (response.maliciousPackages) {
                    const currentMalicious = new Set(response.maliciousPackages.map(pkg => pkg.toLowerCase()));
                    
                    suspiciousPackages.forEach(pkg => {
                        if (currentMalicious.has(pkg.name.toLowerCase())) {
                            pkg.riskLevel = 'HIGH';
                            pkg.reasons = ['Known malicious package'];
                        }
                    });
                    
                    chrome.storage.local.set({ suspiciousPackages: suspiciousPackages });
                    displayPackages();
                }
            });
        }, 30000);
    </script>
</body>
</html>
