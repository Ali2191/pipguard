[tool.poetry]
name = "pipguard-security"
version = "0.3.0"
description = "A security tool to prevent accidental installation of malicious AI-generated packages"
authors = ["PipGuard Team"]
readme = "README.md"
license = "MIT"
packages = [{include = "pipguard"}]

[tool.poetry.dependencies]
python = "^3.9"
typer = "^0.25.0"
rich = "^15.0.0"
requests = "^2.33.0"
httpx = "^0.28.0"
rapidfuzz = "^3.14.0"
watchdog = "^3.0.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pipguard = "pipguard.cli:main"
pipguard-security = "pipguard.cli:main"

